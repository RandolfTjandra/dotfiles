# Hologram: the cursor is a translucent cyan projection (scanlines, a bright base, a thin frame) and each typed letter is printed by a rising scanline. Enter: a scan runs out from the cursor along the input box, its lines light up and a wireframe grid flickers in; done: the scans come in from both edges and meet.
cursor-color = #4cc8f0
cursor-style-blink = false
custom-shader = ../shaders/hologram-cursor.glsl
