# Mecha: robot style; the cursor is armor (white with blue and red plates, a yellow V crest, sensor eyes that glint) typing fires a short thruster burst behind it and Backspace one from its right side. The prompt mark ❯ is a steel-blue targeting chevron that locks on now and then. Enter: energy blades ignite from the cursor along the input box lines; done: two blades ignite at the window's edges and clash in the middle.
cursor-color = #bcc8dc
cursor-style-blink = false
custom-shader = ../shaders/mecha-cursor.glsl
