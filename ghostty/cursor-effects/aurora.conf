# Aurora: the cursor glows with drifting aurora colors; northern lights. Typing sends a wisp of light off the cursor; a jump along the row sweeps a ribbon. Enter: shimmering green, teal and violet curtains hang along the input box lines, out from the cursor; done: in from the edges.
cursor-color = #7fe0c0
cursor-style-blink = false
custom-shader = ../shaders/aurora-cursor.glsl
