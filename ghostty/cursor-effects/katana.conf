# Katana: the cursor is polished steel with a slow sheen; every keystroke slashes the cursor corner to corner, its halves part for an instant and sparks fly off. Enter: the blade sweeps out from the cursor along the input box lines, cutting them in two; the halves slide apart, then join again.
cursor-color = #b8c4d4
cursor-style-blink = false
custom-shader = ../shaders/katana-cursor.glsl
